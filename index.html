<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rota Curitiba – bus trip planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --field:#fafbf9; --soft:#eef1ec; --hover:#eef6f1; --sep:#f0f2ef; --dot:#ffffff; --grab:#d5d9d3; --faint:#b3b8b2; --chipwalk:#eceee9;
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1b1f1d; --muted:#6a716d; --line:#e3e6e1;
  --accent:#0b7a4b; --accent-ink:#ffffff; --walk:#5b6470; --warn:#b4531a;
  --shadow:0 6px 24px rgba(20,30,25,.14);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --field:#1c2220; --soft:#26302c; --hover:#1f3a2e; --sep:#252c29; --dot:#151a18; --grab:#3a433f; --faint:#56605b; --chipwalk:#2a322f;
  --bg:#121615; --panel:#181d1b; --ink:#e7ece9; --muted:#97a19c; --line:#2c3531; --accent:#2fa36f; --walk:#a3adb8;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.picking{cursor:crosshair}
.panel{position:fixed;z-index:5;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column}
@media (min-width:760px){ .panel{top:12px;left:12px;bottom:12px;width:380px;border-radius:14px} }
@media (max-width:759px){ .panel{left:0;right:0;bottom:0;max-height:62vh;border-radius:16px 16px 0 0}
  .panel.collapsed .body{display:none} }
.head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.brand .sp{flex:1}
.brand button{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;margin-bottom:6px;background:var(--field);position:relative}
.field .tag{width:9px;height:9px;border-radius:50%;flex:none}
.field input{border:0;outline:0;background:none;flex:1;padding:9px 0;min-width:0}
.field .pick{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;font-size:12px;white-space:nowrap}
.field .pick.on{color:var(--accent);font-weight:600}
.row{display:flex;gap:6px;align-items:center}
.row input{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--field);min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field);flex:none}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:600}
.seg button:hover{color:var(--ink)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.swap{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:50%;width:30px;height:30px;cursor:pointer;flex:none}
.daynote{font-size:12px;color:var(--muted);margin-top:6px}
.body{overflow:auto;flex:1;padding:6px 0 12px}
.sugg{position:absolute;left:-1px;right:-1px;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:var(--shadow);z-index:10;max-height:260px;overflow:auto;display:none}
.sugg div{padding:8px 10px;cursor:pointer;border-top:1px solid var(--sep)}
.sugg div:hover,.sugg div.act{background:var(--hover)}
.sugg small{display:block;color:var(--muted);font-size:11px}
.msg{padding:14px;color:var(--muted)}
.opt{margin:6px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.opt .tt{font-weight:700;font-size:15px}
.opt .dur{color:var(--muted);font-size:12px}
.otag{font-size:11px;font-weight:700;color:var(--accent);background:var(--hover);border-radius:6px;padding:2px 7px;white-space:nowrap}
.opt .go{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px;text-align:right}
.opt.nohover{cursor:default}
.opt:not(.nohover):hover{border-color:var(--accent)}
.lhint{font-size:12px;color:var(--muted);padding:6px 14px 0}
.dtop{padding:6px 10px 0}
.cg{display:inline-flex;align-items:center;gap:2px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px;color:#fff}
.chip.walk{background:var(--chipwalk);color:var(--walk);font-weight:500}
.arrow{color:var(--faint);font-size:11px}
.legs{margin:8px 0 2px;border-top:1px dashed var(--line);padding-top:8px}
.leg{display:grid;grid-template-columns:44px 14px 1fr;gap:0 8px;font-size:13px}
.leg .t{font-variant-numeric:tabular-nums;font-weight:600;padding-top:1px}
.leg .bar{position:relative}
.leg .bar:before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:4px;border-radius:2px;background:var(--c,#ccc)}
.leg .bar.walk:before{background:repeating-linear-gradient(var(--walk) 0 3px,transparent 3px 6px);width:2px;left:6px}
.leg .bar:after{content:"";position:absolute;left:2px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--dot);border:2px solid var(--c,#999)}
.leg .bar.end:before{display:none}
.leg .d{padding-bottom:12px}
.leg .d b{font-weight:600}
.leg .d small{color:var(--muted);display:block}
.stopsBtn{display:inline-block;margin-top:4px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.leg.mid{font-size:12px;color:var(--muted)}
.leg.mid .t{font-weight:500;color:var(--muted)}
.leg.mid .d{padding-bottom:7px}
.leg.mid .bar:after{width:6px;height:6px;left:4px;top:5px;border-width:2px}
.next{color:var(--muted);font-size:12px}
.more{display:flex;gap:6px;justify-content:center;margin:8px 10px}
.dep{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;border-top:1px solid var(--sep)}
.dep .chip{margin-top:1px}
.dep .h{flex:1;min-width:0;line-height:1.3;overflow-wrap:anywhere}
.dep .h small{display:block;color:var(--muted);font-size:12px}
.lname{font-size:12px;color:var(--ink);font-weight:500;margin-left:2px}
.lines{display:flex;flex-wrap:wrap;gap:6px 10px;margin:6px 0 4px}
.lpick{cursor:pointer;border-radius:6px;padding:1px 2px}
.lpick:hover{background:var(--hover)}
.lhead{margin:6px 0 6px;line-height:1.5;font-size:13px}
.lhead b{font-weight:600}
.lbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.btn.mini{padding:4px 9px;font-size:12px;border-radius:8px;font-weight:600}
.dep .w{font-variant-numeric:tabular-nums;font-weight:600}
.dep .in{color:var(--muted);font-size:12px;width:52px;text-align:right}
.stophead{padding:10px 14px 6px}
.stophead h3{margin:0 0 2px;font-size:15px}
.stophead .row{margin-top:8px}
.foot{font-size:11px;color:var(--muted);padding:8px 14px 0}
.grab{display:none}
@media (max-width:759px){.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 8px;cursor:pointer}}
#zoom{position:fixed;right:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:18px;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);flex-direction:column;gap:10px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1b1f1d;color:#fff;padding:8px 14px;border-radius:20px;z-index:30;font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="locBtn" aria-label="My location" title="My location" style="color:#1a73e8;font-size:20px">◎</button></div>
<div class="toast" id="toast"></div>
<div id="loading"><div class="spin"></div><div id="loadmsg">Loading Curitiba bus network…</div></div>

<div class="panel" id="panel">
  <div class="head">
    <div class="grab" id="grab"></div>
    <div class="brand"><span class="dot"></span>Rota Curitiba<span class="sp"></span><button id="themeBtn" title="Light / dark mode" aria-label="Toggle light or dark mode">◐</button><button id="aboutBtn">About data</button></div>
    <div class="row" style="align-items:stretch">
      <div style="flex:1;min-width:0">
        <div class="field"><span class="tag" style="background:#0b7a4b"></span><input id="fromIn" placeholder="From: address, stop or place" autocomplete="off"><button class="pick" data-which="from">Map</button><div class="sugg" id="fromSugg"></div></div>
        <div class="field"><span class="tag" style="background:#c0392b"></span><input id="toIn" placeholder="To: address, stop or place" autocomplete="off"><button class="pick" data-which="to">Map</button><div class="sugg" id="toSugg"></div></div>
      </div>
      <div style="display:flex;align-items:center;padding-left:6px"><button class="swap" id="swap" title="Swap">⇅</button></div>
    </div>
    <div class="row" style="margin-top:2px">
      <div class="seg" id="when"><button type="button" data-v="now" class="on">Leave now</button><button type="button" data-v="at">Depart at</button><button type="button" data-v="arrive">Arrive by</button></div>
      <span style="flex:1"></span>
      <button class="btn" id="go">Route</button>
    </div>
    <div class="row" id="atRow" style="display:none;margin-top:6px">
      <input type="date" id="date" style="flex:1 1 0;min-width:0">
      <input type="time" id="time" style="flex:0 0 auto;width:auto;min-width:150px">
    </div>
    <div class="daynote" id="daynote"></div>
  </div>
  <div class="body" id="body"><div class="msg">Choose where you're starting and where you're going. Type an address (e.g. <i>Rua XV de Novembro, 300</i>), a stop, a neighbourhood or a place, or tap <b>Map</b> and then tap a spot on the map. Tap any stop on the map to see the next buses.</div></div>
</div>

<script>
"use strict";
const APP_VERSION="2026-11-11.8";
/* ================= utilities ================= */
const $ = id => document.getElementById(id);
const TZ = 'America/Sao_Paulo';
const pad = n => String(n).padStart(2,'0');
function fmt(sec){ sec = Math.round(sec/60)*60; let m=Math.floor(sec/60); const h=Math.floor(m/60)%24; m%=60; return pad(h)+':'+pad(m); }
function durTxt(sec){ const m=Math.round(sec/60); if(m<60) return m+' min'; return Math.floor(m/60)+' h '+(m%60? (m%60)+' min':''); }
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
const TYPES={r:'rua',rua:'rua',av:'avenida',avenida:'avenida',al:'alameda',alameda:'alameda',tv:'travessa',trav:'travessa',travessa:'travessa',pca:'praca',pc:'praca',praca:'praca',rod:'rodovia',rodovia:'rodovia',estr:'estrada',estrada:'estrada',lgo:'largo',largo:'largo'};
const TITLES={prof:'professor',profa:'professora',dr:'doutor',dra:'doutora',cel:'coronel',gen:'general',dep:'deputado',sen:'senador',eng:'engenheiro',des:'desembargador',pe:'padre',sta:'santa',sto:'santo',mal:'marechal',cap:'capitao',ten:'tenente',maj:'major',pres:'presidente',gov:'governador',com:'comendador',brig:'brigadeiro',alm:'almirante',min:'ministro',cons:'conselheiro',ver:'vereador',vig:'vigario',d:'dom',nsa:'nossa',sra:'senhora',n:'nossa',s:'sao'};
const STOPW=new Set(['de','da','do','das','dos','e']);
function normKey(s,isQuery){ const w=norm(s).match(/[a-z0-9]+/g)||[]; if(!w.length) return ''; const t=TYPES[w[0]]; const rest=(t?w.slice(1):w).filter(x=>!STOPW.has(x)).map(x=>TITLES[x]||x); return ((t||(isQuery?'':'rua'))+' '+rest.join(' ')).trim(); }
function geocodeStreet(st,num){ // -> {x,y,approx,label}
  const L=st.nums;
  if(num!=null && L.length){
    let lo=null,hi=null; for(const p of L){ if(p.n<=num) lo=p; if(p.n>=num&&!hi) hi=p; }
    if(lo&&hi){ if(hi.n===lo.n) return {x:lo.x,y:lo.y,approx:lo.n!==num}; const t=(num-lo.n)/(hi.n-lo.n); return {x:lo.x+(hi.x-lo.x)*t,y:lo.y+(hi.y-lo.y)*t,approx:true}; }
    const e=lo||hi; return {x:e.x,y:e.y,approx:true,far:Math.abs(e.n-num)>400, near:e.n};
  }
  const pts=L.length?L:st.pts; const m=pts[pts.length>>1]; return {x:m.x,y:m.y,approx:true};
}
function addrSearch(q){
  const out=[]; if(!addrIdx) return out;
  const m=q.match(/^(.*?)[,\s]+(?:n[ºo°.]?\s*)?(\d{1,5})\b\s*(?:[-,]\s*(.*))?$/i);
  const streetQ=(m?m[1]:q).trim(), num=m?+m[2]:null, extra=m&&m[3]?norm(m[3]):'';
  const qk=normKey(streetQ,true).split(' ').filter(Boolean);
  if(qk.length && streetQ.length>=3){
    for(const st of addrIdx.streets){ const k=st.k;
      if(!qk.every(w=>k.some(x=>x.startsWith(w)))) continue;
      let sc=0; if(k[0]===qk[0]) sc-=1; if(extra && norm(st.bairro).includes(extra)) sc-=2; sc+=k.length*0.05;
      out.push({sc, kind:'addr', st, num}); }
  }
  out.sort((a,b)=>a.sc-b.sc);
  const qn=norm(q.trim()); const ws=qn.split(/\s+/);
  const res=out.slice(0,8).map(o=>{ const g=geocodeStreet(o.st,o.num); const label=o.st.name+(o.num!=null?', '+o.num:'');
    return {label, sub:(o.st.bairro?o.st.bairro+' · ':'')+(o.num!=null?(g.far?'number not found, showing near nº '+g.near:(g.approx?'position estimated':'exact address')):'street'), x:g.x,y:g.y, kind:'addr', sc:o.num!=null?-3:0.5}; });
  if(!m && qn.length>=3){
    for(const b of addrIdx.bairros) if(ws.every(w=>b.n.includes(w))) res.push({label:b.name,sub:'Neighbourhood',x:b.x,y:b.y,kind:'bairro',sc:b.n.startsWith(qn)?-2.5:0.2});
    const ref=state.me||{x:view.x,y:view.y}; const pr=[];
    for(const p of addrIdx.pois){ const byName=ws.every(w=>p.n.includes(w)); const byCat=!byName&&ws.every(w=>p.k.includes(w)||p.n.includes(w)); if(!byName&&!byCat) continue;
      const dist=Math.hypot(p.x-ref.x,p.y-ref.y); pr.push({label:p.name,sub:pcat(p.cat).l+(p.detail?' · '+p.detail:'')+` · ${dist<1000?Math.round(dist/10)*10+' m':(dist/1000).toFixed(1)+' km'} away`,x:p.x,y:p.y,kind:'poi',icon:pcat(p.cat).i,
        sc:(byName?(p.n.startsWith(qn)?-1:0.1):0.35)+Math.min(dist,20000)/40000}); }
    pr.sort((a,b)=>a.sc-b.sc); res.push(...pr.slice(0,15));
  }
  return res;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t,ms=2200){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display='none',ms); }
function nowSP(){ // {date:'YYYY-MM-DD', sec}
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return {date:`${g('year')}-${g('month')}-${g('day')}`, sec:(+g('hour')%24)*3600+(+g('minute'))*60+(+g('second'))};
}
/* Holidays: URBS runs the Sunday timetable on holidays. */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mo-1,da));}
function holidayName(ds){
  const [y,m,d]=ds.split('-').map(Number); const md=pad(m)+'-'+pad(d);
  const fixed={'01-01':'New Year','04-21':'Tiradentes','05-01':'Labour Day','09-07':'Independence Day','09-08':'Nossa Sra. da Luz (Curitiba)','10-12':'Nossa Sra. Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Christmas'};
  if(fixed[md]) return fixed[md];
  const e=easter(y), dt=new Date(Date.UTC(y,m-1,d)); const diff=Math.round((dt-e)/864e5);
  if(diff===-2) return 'Good Friday'; if(diff===60) return 'Corpus Christi'; if(diff===-47) return 'Carnival';
  return null;
}
function dayType(ds){ // 'u' weekday, 's' saturday, 'd' sunday/holiday
  const h=holidayName(ds); if(h) return {k:'d',label:`Holiday (${h}) – Sunday timetable`};
  const [y,m,d]=ds.split('-').map(Number); const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  if(w===0) return {k:'d',label:'Sunday timetable'}; if(w===6) return {k:'s',label:'Saturday timetable'};
  return {k:'u',label:'Weekday timetable'};
}
function prevDate(ds){ const [y,m,d]=ds.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d)-864e5); return t.toISOString().slice(0,10); }

/* ================= data ================= */
let D=null;              // raw
let addrIdx, stopGroup, N=0, SX, SY, SLAT, SLON, SNAME, stopPats, foot, searchIdx;
const LAT0=-25.4296, LON0=-49.2713, KX=111320*Math.cos(LAT0*Math.PI/180), KY=110540;
const WALK=1.25;         // m/s ≈ 4.5 km/h, an average adult pace on city sidewalks
const DETOUR=1.3;
const MAX_ACCESS=900;    // m straight-line for origin/destination walk
const MAX_XFER=350;      // m straight-line between stops for transfers
const MIN_XFER=60;       // s added to every walking transfer

function walkSec(d){ return Math.round(d*DETOUR/WALK); }            // straight-line fallback before the street graph loads
function streetSec(m){ return Math.round(m/WALK + Math.min(90, m/250*15)); }   // street distance + ~15 s per 250 m for crossings and lights

async function loadData(){
  const r = await fetch('data.json?v='+APP_VERSION); if(!r.ok) throw new Error('data.json '+r.status);
  D = await r.json();
  const st=D.stops; N=st.n.length;
  SNAME=st.n; SLAT=new Float64Array(N); SLON=new Float64Array(N); SX=new Float32Array(N); SY=new Float32Array(N);
  for(let i=0;i<N;i++){ SLAT[i]=st.la[i]/1e5; SLON[i]=st.lo[i]/1e5; SX[i]=(SLON[i]-LON0)*KX; SY[i]=(SLAT[i]-LAT0)*KY; }
  // patterns
  stopPats=Array.from({length:N},()=>[]);
  D.pats.forEach((P,pi)=>{
    P.route=P[0]; P.head=P[1]; P.stops=P[2]; const cum=P[3], anc=P[4], tt=P[5]; const L=P.stops.length, A=anc.length;
    P.stops.forEach((s,pos)=>{ if(pos<L-1) stopPats[s].push(pi,pos); });
    // segment + fraction of each stop between timing anchors (by distance along the route)
    const seg=new Int32Array(L), fr=new Float32Array(L);
    for(let pos=0,k=0;pos<L;pos++){ while(k<A-2 && pos>anc[k+1]) k++; seg[pos]=k; const d0=cum[anc[k]], d1=cum[anc[k+1]]; fr[pos]=d1>d0? Math.min(1,Math.max(0,(cum[pos]-d0)/(d1-d0))) : (pos>=anc[k+1]?1:0); }
    P.minOff=new Int32Array(L).fill(1e9); P.maxOff=new Int32Array(L);
    P.T={};
    for(const k of ['u','s','d']){ const a=tt[k]||[]; const n=a.length/A; const st=new Int32Array(n), tm=new Int32Array(n*L);

let whenMode='now';
$('when').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; whenMode=b.dataset.v; [...$('when').children].forEach(x=>x.classList.toggle('on',x===b)); const at=whenMode!=='now'; $('atRow').style.display=at?'flex':'none'; updDay(); });
$('date').onchange=$('time').onchange=()=>updDay();
function queryTime(){ if(whenMode==='now'){ return nowSP(); } const [h,m]=($('time').value||'00:00').split(':').map(Number); return {date:$('date').value||nowSP().date, sec:h*3600+m*60}; }
function updDay(){ const q=queryTime(); $('daynote').textContent=dayType(q.date).label+(D?` · data from URBS, ${D.gen}`:'')+` · v${APP_VERSION}`; }
$('go').onclick=()=>{ if(!state.from||!state.to){ toast('Set both start and destination'); return;} plan(); };

/* ------- planning ------- */
function shiftItin(it,sh){ it.start+=sh; it.end+=sh; it.legs.forEach(l=>{ if(l.type==='ride'){l.dep+=sh;l.arr+=sh;} else {l.start+=sh;l.end+=sh;} }); return it; }
function itinWalk(it){ return it.legs.reduce((a,l)=>a+(l.type==='walk'&&!l.hide?l.dur:0),0); }
function itinSig(it){ return it.legs.filter(l=>l.type==='ride'&&!l.cont).map(l=>D.routes[D.pats[l.p].route][0]+'@'+D.pats[l.p].stops[l.fromPos]).join('>'); }
function plan(laterFrom){
  const q=queryTime(); const arrive=whenMode==='arrive'&&laterFrom==null; let t0=laterFrom!=null?laterFrom:q.sec; const T=arrive?q.sec:null;
  const o=state.from,d=state.to;
  const access=(p)=>{ const near=nearStops(p.x,p.y,MAX_ACCESS);
    const f=WG? streetDists(p.x,p.y,MAX_ACCESS*1.5) : null;
    if(!f) return near.map(([s,dd])=>[s,walkSec(dd)]);
    const out=[]; for(const [s,dd] of near){ const m=f(s); if(m===null) out.push([s,walkSec(dd)]); else if(m<=MAX_ACCESS*1.5) out.push([s,streetSec(m)]); }   // too far by street: left out
    return out; };
  const os=access(o), ds=access(d);
  const day=dayType(q.date).k, pday=dayType(prevDate(q.date)).k;
  const run=(t,banned)=>{ if(!os.length||!ds.length) return []; let r=raptor(os,ds,t,day,5,banned);
    if(t<4*3600) r=r.concat(raptor(os,ds,t+86400,pday,5,banned).map(it=>shiftItin(it,-86400))); return r; };
  if(arrive){ // latest departure that still arrives by T: earliest arrival only grows with departure time, so binary-search it
    const ea=t=>{ const r=run(t).filter(i=>i.rides); return r.length?Math.min(...r.map(i=>i.end)):Infinity; };
    let lo=Math.max(0,T-4*3600), hi=T;
    if(ea(lo)>T){ state.itins=[]; state.sel=-1; state.view='list'; state.t0=T; state.arriveBy=T; state.qdate=q.date; renderResults(); return; }
    while(hi-lo>60){ const mid=Math.floor((lo+hi)/2); if(ea(mid)<=T) lo=mid; else hi=mid; }
    t0=Math.max(0,lo-25*60); var latest=lo; }
  const all=[];
  // 1) best trips now, 2) the next few departures, 3) other line combinations (each line of the best trips left out once)
  let cur=run(t0); all.push(...cur);
  for(let k=0;k<(arrive?12:3)&&cur.length;k++){ const first=cur.filter(it=>it.rides).sort((a,b)=>a.start-b.start)[0]; if(!first||(arrive&&first.start>latest)) break; cur=run(first.start+60); all.push(...cur); }
  if(arrive) all.push(...run(latest));
  const top=all.slice().sort(arrive?((a,b)=>b.start-a.start):((a,b)=>a.end-b.end)).filter(i=>!arrive||i.end<=T).slice(0,3); const tried=new Set();
  for(const it of top) for(const l of it.legs){ if(l.type!=='ride')continue; const ri=D.pats[l.p].route; if(tried.has(ri)||tried.size>=5)continue; tried.add(ri); all.push(...run(t0,new Set([ri]))); if(arrive) all.push(...run(latest-10*60,new Set([ri]))); }
  const firstLines=top.map(it=>{ const l=it.legs.find(l=>l.type==='ride'); return l?D.pats[l.p].route:null; }).filter(x=>x!=null);
  const uniq=[...new Set(firstLines)]; if(uniq.length) { const alt=run(t0,new Set(uniq)); all.push(...alt);
    const a2=alt.sort((a,b)=>a.end-b.end)[0]; const l2=a2&&a2.legs.find(l=>l.type==='ride'); if(l2) all.push(...run(t0,new Set([...uniq,D.pats[l2.p].route]))); }
  // clean up: drop duplicates and trips that are worse in every way than another one
  const seen=new Map(); let list=[];
  for(const it of all){ if(!it.rides) continue; const k=itinSig(it)+'|'+it.start; if(seen.has(k)) continue; seen.set(k,1); it.walk=itinWalk(it); list.push(it); }
  const lines=it=>itinSig(it).replace(/@\d+/g,'');
  const worse=(x,y)=>{ if(y===x) return false;
    if(lines(y)===lines(x)) return y.end<=x.end&&y.start>=x.start&&y.walk<=x.walk&&(y.end<x.end||y.start>x.start||y.walk<x.walk);
    return y.rides<=x.rides&&y.walk<=x.walk+60&&y.end<=x.end-600&&y.start>=x.start-60; };   // a different set of lines stays unless beaten by 10+ min
  list=list.filter(x=>!list.some(y=>worse(x,y)));
  if(arrive) list=list.filter(i=>i.end<=T);
  const bestEnd=Math.min(...list.map(i=>i.end)); if(!arrive) list=list.filter(i=>i.end<=bestEnd+40*60);
  // at most 2 departures of the same combination of lines
  const perSig=new Map(); list.sort(arrive?((a,b)=>b.start-a.start):((a,b)=>a.end-b.end)); list=list.filter(i=>{ const s=itinSig(i).replace(/@\d+/g,''); const n=perSig.get(s)||0; perSig.set(s,n+1); return n<2; });
  const wpath=walkPath(o.x,o.y,d.x,d.y); const wd=wpath&&wpath.len? streetSec(wpath.len) : directWalk(o.x,o.y,d.x,d.y);
  const ws=arrive?T-wd:t0;
  if(wd<45*60 && !(list.length && (arrive? Math.max(...list.map(i=>i.start))>ws+600 : Math.min(...list.map(i=>i.end))<t0+wd-600))) list.push({walkOnly:true,start:ws,end:ws+wd,walk:wd,legs:[{type:'walk',from:'orig',to:'dest',dur:wd,start:ws,end:ws+wd}],rides:0});
  const score=arrive? (it=>-it.start+Math.max(0,it.rides-1)*300+it.walk*0.3) : (it=>it.end+Math.max(0,it.rides-1)*300+it.walk*0.3);
  list.sort((a,b)=>score(a)-score(b)); list=list.slice(0,8);
  // labels
  const tr=list.filter(i=>!i.walkOnly);
  if(tr.length){ const f=arrive? tr.reduce((a,b)=>b.start>a.start?b:a) : tr.reduce((a,b)=>b.end<a.end?b:a); f.tag=arrive?'Latest departure':'Fastest';
    const m=Math.min(...tr.map(i=>i.rides)); const fe=tr.filter(i=>i.rides===m).reduce((a,b)=>b.end<a.end?b:a); if(!fe.tag && tr.some(i=>i.rides>m)) fe.tag='Fewest transfers';
    const lw=tr.reduce((a,b)=>b.walk<a.walk?b:a); if(!lw.tag && tr.some(i=>i.walk>lw.walk+120)) lw.tag='Least walking'; }
  state.itins=list; state.sel=list.length?0:-1; state.view='list'; state.stopSel=null; state.expanded=null; state.t0=t0; state.arriveBy=T; state.qdate=q.date;
  renderResults(); if(state.sel>=0) fitItin();
}
function fitItin(){ const it=state.itins[state.sel]; const pts=[]; it.legs.forEach(l=>pts.push(...legPoints(l))); fitTo(pts); }
function lineChip(ri){ const r=D.routes[ri]; return `<span class="chip" style="background:${r[2]};color:${r[4]||'#fff'}">${esc(r[0])}</span>`; }
function itinChips(it){ return it.legs.filter(l=>(l.type==='ride'&&!l.cont)||(l.type==='walk'&&!l.hide&&l.dur>=120)).map(l=> l.type==='ride'? `<span class="cg">${lineChip(D.pats[l.p].route)}<span class="lname">${esc(D.routes[D.pats[l.p].route][1])}</span></span>` : `<span class="chip walk">🚶 ${Math.round(l.dur/60)}</span>`).join('<span class="arrow">›</span>'); }
function itinMeta(it){ const tx=it.rides>1?(it.rides-1)+' transfer'+(it.rides>2?'s':''):(it.rides===1?'direct':''); const w=Math.round((it.walk||0)/60); return [durTxt(it.end-it.start),tx,w?w+' min walk':''].filter(Boolean).join(' · '); }
function renderResults(){
  const b=$('body');
  if(!state.itins.length){ b.innerHTML=state.arriveBy!=null?`<div class="msg">No trip found that arrives by ${fmt(state.arriveBy)} on this day. Try a later arrival time.</div>`:`<div class="msg">No bus connection found from ${fmt(state.t0)} on this day. Try a later time, or a start or destination closer to a bus stop (within ${MAX_ACCESS} m).</div>`; draw(); return; }
  if(state.view==='detail'){ const it=state.itins[state.sel];
    b.innerHTML=`<div class="dtop"><button class="btn ghost mini" id="back">← All options</button></div>
      <div class="opt sel nohover"><div class="top"><span class="tt">${fmt(it.start)} → ${fmt(it.end)}</span>${it.tag?`<span class="otag">${it.tag}</span>`:''}</div><div class="dur" style="margin-top:2px">${itinMeta(it)}</div><div class="chips">${itinChips(it)}</div>${legsHTML(it)}</div>
      <div class="foot">Times are URBS scheduled times. Times between URBS timing points are estimated from distance, and buses can run early or late in traffic.</div>`;
    $('back').onclick=()=>{ state.view='list'; renderResults(); };
    b.querySelectorAll('.stopsBtn').forEach(btn=>btn.onclick=()=>{ const k=+btn.dataset.k; if(!state.openLegs) state.openLegs=new Set(); state.openLegs.has(k)?state.openLegs.delete(k):state.openLegs.add(k); const st=b.scrollTop; renderResults(); b.scrollTop=st; });
    draw(); return; }
  b.innerHTML=`<div class="lhint">${state.itins.length} option${state.itins.length>1?'s':''}${state.arriveBy!=null?' arriving by '+fmt(state.arriveBy):''} · tap one for details</div>`+state.itins.map((it,i)=>{
    const firstRide=it.legs.find(l=>l.type==='ride');
    return `<div class="opt ${i===state.sel?'sel':''}" data-i="${i}"><div class="top"><span class="tt">${fmt(it.start)} → ${fmt(it.end)}</span>${it.tag?`<span class="otag">${it.tag}</span>`:''}</div>
      <div class="dur" style="margin-top:2px">${itinMeta(it)}</div>
      <div class="chips">${itinChips(it)}</div>${firstRide?`<div class="next">Bus leaves ${esc(SNAME[D.pats[firstRide.p].stops[firstRide.fromPos]])} at ${fmt(firstRide.dep)}</div>`:'<div class="next">Walk the whole way</div>'}
      <div class="go">Details ›</div></div>`;
  }).join('') + `<div class="more"><button class="btn ghost" id="earlier">Earlier</button><button class="btn ghost" id="later">Later departures</button></div>`;
  b.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{ state.sel=+el.dataset.i; state.view='detail'; state.openLegs=new Set(); renderResults(); $('body').scrollTop=0; fitItin(); };
    el.onmouseenter=()=>{ if(state.view!=='list')return; state.sel=+el.dataset.i; b.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===el)); draw(); };
  });
  $('later').onclick=()=>{ const f=state.itins.filter(it=>!it.walkOnly).sort((a,b)=>a.start-b.start)[0]; plan(f? f.start+60 : state.t0+600); };
  $('earlier').onclick=()=>{ plan(Math.max(0,state.t0-30*60)); };
  draw();
}
function legsHTML(it){
  let h='<div class="legs">';
  const L=it.legs;
  L.forEach((l,i)=>{
    if(l.hide) return;
    if(l.type==='walk'){
      if(l.dur<30 && l.from!=='orig' && l.to!=='dest') return;
      if(l.from==='orig' && l.dur<45) return;
      const to=l.to==='dest'? state.to.label : SNAME[l.to];
      const from=l.from==='orig'? state.from.label : SNAME[l.from];
      const same=from===to; const wp=legPoints(l); const m=Math.round(((wp&&wp.len)||l.dur*WALK/DETOUR)/10)*10;
      h+=`<div class="leg"><div class="t">${fmt(l.start)}</div><div class="bar walk" style="--c:var(--walk)"></div><div class="d"><b>${l.from==='orig'?esc(from):(same?'Change platform':'Walk')}</b><small>🚶 ${same?'Inside '+esc(to)+', ':'Walk '}${Math.max(1,Math.round(l.dur/60))} min${m>=20&&!same?` (~${m} m) to ${esc(to)}`:''}</small></div></div>`;
    } else {
      if(l.cont) return;                                   // merged into the ride it continues
      // this ride plus any "same bus continues" segments that follow it
      const segs=[l]; for(let j=i+1;j<L.length;j++){ const m=L[j]; if(m.type==='walk'&&m.hide) continue; if(m.type==='ride'&&m.cont){ segs.push(m); continue; } break; }
      const P=D.pats[l.p], r=D.routes[P.route], last=segs[segs.length-1], PL=D.pats[last.p];
      const mids=[]; segs.forEach((sg,k)=>{ const Q=D.pats[sg.p]; for(let pos=sg.fromPos+1;pos<=sg.toPos;pos++){ const s=Q.stops[pos]; if(sg===last&&pos===sg.toPos) continue;
          if(mids.length&&SNAME[mids[mids.length-1].s]===SNAME[s]) continue; mids.push({s,t:tripTime(Q,sg.day,sg.trip,pos)}); } });
      const n=mids.length+1, dur=Math.round((last.arr-l.dep)/60);
      const others=nextTrips(P,l.day,l.fromPos,l.dep+60,3).map(fmt).join(', ');
      const open=state.openLegs&&state.openLegs.has(i);
      h+=`<div class="leg"><div class="t">${fmt(l.dep)}</div><div class="bar" style="--c:${r[2]}"></div><div class="d"><b>${esc(SNAME[P.stops[l.fromPos]])}</b><small>${lineChip(P.route)} ${esc(r[1])} → ${esc(PL.head)}</small>${l.wait>60?`<small>Wait ${Math.round(l.wait/60)} min${others?' · next buses '+others:''}</small>`:(others?`<small>Next buses ${others}</small>`:'')}
        <button class="stopsBtn" data-k="${i}">${open?'▾':'▸'} ${n} stop${n>1?'s':''} · ${dur} min</button></div></div>`;
      if(open) for(const m of mids) h+=`<div class="leg mid"><div class="t">${fmt(m.t)}</div><div class="bar" style="--c:${r[2]}"></div><div class="d">${esc(SNAME[m.s])}</div></div>`;
      h+=`<div class="leg"><div class="t">${fmt(last.arr)}</div><div class="bar end" style="--c:${r[2]}"></div><div class="d"><b>Get off at ${esc(SNAME[PL.stops[last.toPos]])}</b></div></div>`;
    }
  });
  h+=`<div class="leg"><div class="t">${fmt(it.end)}</div><div class="bar end" style="--c:#c0392b"></div><div class="d"><b>${esc(state.to.label)}</b></div></div></div>`;
  return h;
}
function nextTrips(P,day,pos,t,n){ const T=P.T[day]; const out=[]; for(let i=0;i<T.st.length;i++){ const tt=T.tm[i*T.L+pos]; if(tt>=t) out.push(tt);} out.sort((a,b)=>a-b); return out.slice(0,n); }

/* ------- stop board ------- */
function openStop(s,all,only,pats){
  const name=SNAME[s]; const g=searchIdx[stopGroup[s]]; const stops=g.stops;
  // include stops with same name within 150 m (terminal platforms)
  const tapped=s; const platform=!all&&g.stops.length>1&&(g.term||g.tube);
  const routes=new Set(); for(const st of (platform?[tapped]:stops)){ const sp=stopPats[st]; for(let i=0;i<sp.length;i+=2) routes.add(D.pats[sp[i]].route); }
  if(only!=null){ routes.clear(); routes.add(only); }
  if(state.expanded!=null && state.expanded!==s) state.expanded=null;
  state.stopSel={stops:(platform||only!=null)?[tapped]:stops,routes,only,pats:pats?new Set(pats):null}; state.sel=-1;
  const q=queryTime(); const day=dayType(q.date).k; const t=q.sec;
  const deps=[];
  for(const st of state.stopSel.stops){ const sp=stopPats[st]; for(let i=0;i<sp.length;i+=2){ const P=D.pats[sp[i]], pos=sp[i+1]; if(only!=null&&P.route!==only)continue; if(pats&&!pats.includes(sp[i]))continue; for(const tt of nextTrips(P,day,pos,t,only!=null?12:4)) deps.push({t:tt,P}); } }
  deps.sort((a,b)=>a.t-b.t);
  const b=$('body'); $('panel').classList.remove('collapsed');
  // header: the filtered line (with a button for the other direction), or the stop's lines as tappable boxes
  let otherDir=null;
  if(only!=null&&pats){ const mine=new Set(pats); const myDir=dirOf(pats,tapped);
    const near=[...new Set(g.stops.concat(nearStops(SX[tapped],SY[tapped],300).map(a=>a[0])))].sort((a,b)=>Math.hypot(SX[a]-SX[tapped],SY[a]-SY[tapped])-Math.hypot(SX[b]-SX[tapped],SY[b]-SY[tapped]));
    for(const st of near){ for(const e of stopEntries(st)){ if(e.ri!==only||e.pats.some(p=>mine.has(p)))continue;
      if(Math.abs(Math.atan2(Math.sin(e.ang-myDir),Math.cos(e.ang-myDir)))>1.6){ otherDir={s:st,pats:e.pats}; break; } } if(otherDir)break; } }
  const headerLines=()=>{
    if(only!=null){ const hd=pats?D.pats[pats[0]].head:''; return `<div class="lhead">${lineChip(only)} <b>${esc(D.routes[only][1])}</b>${hd?` <span style="color:var(--muted)">→ ${esc(hd)}</span>`:''}</div><div class="lbtns">${otherDir?'<button class="btn ghost mini" id="otherDir">⇄ Other direction</button>':''}<button class="btn ghost mini" id="clrLn">✕ All lines</button></div>`; }
    const ents=platform?stopEntries(tapped):[].concat(...stops.map(stopEntries));
    const seen=new Set(); const list=ents.filter(e=>{ const k=e.ri+':'+e.pats[0]; if(seen.has(k))return false; seen.add(k); return true; });
    return `<div class="lines">${list.map((e,n)=>`<span class="lpick" data-n="${n}">${lineChip(e.ri)}<span class="lname">${esc(D.routes[e.ri][1])} <span style="color:var(--muted)">→ ${esc(e.head)}</span></span></span>`).join('')}</div>`+(platform?'<div class="next"><a href="#" id="allPl" style="color:var(--accent)">show all platforms</a></div>':'');
  };
  const pickList=only!=null?null:(()=>{ const ents=platform?stopEntries(tapped):[].concat(...stops.map(st=>stopEntries(st).map(e=>({...e,st})))); const seen=new Set(); return ents.filter(e=>{ const k=e.ri+':'+e.pats[0]; if(seen.has(k))return false; seen.add(k); return true; }); })();
  b.innerHTML=`<div class="stophead"><h3>${esc(name)}</h3>${headerLines()}<div class="next">${dayType(q.date).label} · from ${fmt(t)}</div><div class="row"><button class="btn ghost" id="sf">Start here</button><button class="btn ghost" id="st">Go here</button></div></div>`+
    (deps.length? deps.slice(0,30).map(d=>`<div class="dep">${lineChip(d.P.route)}<span class="h">${esc(D.routes[d.P.route][1])}<small>→ ${esc(d.P.head)}</small></span><span class="w">${fmt(d.t)}</span><span class="in">${Math.round((d.t-t)/60)} min</span></div>`).join('') : '<div class="msg">No more scheduled buses at this stop today.</div>');
  const pt={x:SX[s],y:SY[s],label:name};
  if($('clrLn')) $('clrLn').onclick=()=>openStop(tapped);
  if($('otherDir')) $('otherDir').onclick=()=>openStop(otherDir.s,false,only,otherDir.pats);
  b.querySelectorAll('.lpick').forEach(el=>el.onclick=()=>{ const e=pickList[+el.dataset.n]; openStop(e.st!=null?e.st:tapped,false,e.ri,e.pats); });
  if($('allPl')) $('allPl').onclick=e=>{ e.preventDefault(); openStop(tapped,true); };
  $('sf').onclick=()=>setPoint('from',pt); $('st').onclick=()=>setPoint('to',pt);
  draw();
}
$('aboutBtn').onclick=()=>{ const b=$('body'); state.sel=-1; $('panel').classList.remove('collapsed');
  b.innerHTML=`<div class="msg" style="color:var(--ink)"><p><b>Where the times come from.</b> Timetables, stops and routes come from URBS (Urbanização de Curitiba) open data, published daily by UFPR at dadosabertos.c3sl.ufpr.br. This copy is from <b>${esc(D.gen)}</b> and covers ${D.routes.length} lines and ${N.toLocaleString()} stops.</p>
  <p><b>How a route is found.</b> URBS publishes departure times at timing points (terminals and main stops). Times at the stops in between are estimated from the distance along the route. The planner searches every combination of buses with up to 4 transfers, plus short walks between nearby stops (under ${MAX_XFER} m), and lists the fastest trip for each number of transfers.</p>
  <p><b>Map.</b> Streets, parks and water © OpenStreetMap contributors (ODbL), stored inside the app.</p><p><b>Walking.</b> Walks follow the OpenStreetMap streets at about 4.5 km/h, plus a little time for crossings and traffic lights. Nearby stops are chosen by walking distance along streets, not straight-line distance. For short hops under 150 m (crossing an avenue to a tube station, changing platforms) the app assumes you cross directly.</p><p><b>Places.</b> About 10,000 restaurants, cafés, bars, shops, supermarkets, pharmacies, hospitals, schools, hotels, museums and parks from OpenStreetMap and URBS. Search by name or by type (e.g. <i>pizza</i>, <i>farmácia</i>, <i>mercado</i>); nearer places come first. Zoom in to see them on the map.</p><p><b>Calendar.</b> Weekday, Saturday and Sunday timetables are chosen automatically. On national and Curitiba holidays, URBS runs the Sunday timetable.</p>
  <p><b>Limits.</b> No live GPS positions. Real buses can run early or late, so leave a few minutes of margin. Addresses are searched offline using OpenStreetMap (about 10,000 Curitiba streets and 300,000 house numbers, © OpenStreetMap contributors) plus URBS stop addresses. When a house number isn't mapped, its position is estimated between the nearest known numbers. Metropolitan lines not run by URBS (Metrocard) aren't included.</p></div>`; draw(); };

function startGPS(onFail){
  if(!navigator.geolocation){ onFail&&onFail(); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>{ gotFix(p);
      try{ if(geoWatch==null) geoWatch=navigator.geolocation.watchPosition(gotFix,()=>{}, {enableHighAccuracy:true,maximumAge:10000}); }catch(e){} },
    ()=>{ onFail&&onFail(); }, {enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }catch(e){ onFail&&onFail(); }
}
function gotFix(p){ const [x,y]=llToXY(p.coords.latitude,p.coords.longitude); state.me={x,y,acc:p.coords.accuracy,src:'gps'}; if(!state.from && D){ state.from={x,y,label:'My location'}; $('fromIn').value='My location'; } for(const w of ['from','to']) if(state[w]&&state[w].label==='My location'){ state[w].x=x; state[w].y=y; } afterMe(); draw(); }
function afterMe(){ if(pendingMe){ const w=pendingMe; pendingMe=null; setPoint(w,{x:state.me.x,y:state.me.y,label:'My location'}); } }
function askManualLocation(){ setPicking('me'); toast('Location isn’t available here. Tap the map where you are.',3500); }
function locate(){
  if(state.me){ const [px,py]=w2s(state.me.x,state.me.y); const centred=Math.hypot(px-W/2,py-H/2)<30;
    if(centred && state.me.src==='manual'){ askManualLocation(); return; }
    userMoved=true; view.x=state.me.x; view.y=state.me.y; if(view.s<0.5) view.s=0.8; draw();
    if(state.me.src==='manual') toast('Tap ◎ again to move your location'); return; }
  toast('Finding your location…'); startGPS(()=>askManualLocation());
}
function setMeManual(x,y){ state.me={x,y,src:'manual'}; if(!state.from){ state.from={x,y,label:'My location'}; $('fromIn').value='My location'; } try{ localStorage.setItem('rc-me',JSON.stringify({x,y})); }catch(e){} toast('Location saved on this device'); afterMe(); draw(); }
function drawMe(){ const m=state.me; if(!m) return; const [px,py]=w2s(m.x,m.y);
  if(m.acc&&m.acc*view.s>9){ ctx.fillStyle='rgba(26,115,232,.15)'; ctx.strokeStyle='rgba(26,115,232,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,m.acc*view.s,0,7); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle='rgba(26,115,232,.22)'; ctx.beginPath(); ctx.arc(px,py,14,0,7); ctx.fill();
  ctx.fillStyle=ME_COLOR; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,7.5,0,7); ctx.fill(); ctx.stroke(); }
$('locBtn').onclick=locate;
/* ================= theme ================= */
let THEME='light';
function sysDark(){ try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } }
function applyTheme(t){ THEME=t; document.documentElement.dataset.theme=t; $('themeBtn').textContent=t==='dark'?'☀︎ Light':'☾ Dark'; Object.assign(BMSTYLE, t==='dark'?BM_DARK:BM_LIGHT); MS=t==='dark'?MS_DARK:MS_LIGHT; draw(); }
(function(){ let saved=null; try{ saved=localStorage.getItem('rc-theme'); }catch(e){}
  applyTheme(saved||(sysDark()?'dark':'light'));
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{ let s=null; try{s=localStorage.getItem('rc-theme');}catch(_){} if(!s) applyTheme(e.matches?'dark':'light'); }); }catch(e){}
})();
$('themeBtn').onclick=()=>{ const t=THEME==='dark'?'light':'dark'; try{ localStorage.setItem('rc-theme',t); }catch(e){} applyTheme(t); };
/* ================= self-update ================= */
// phones often keep an old copy of the page open; check for a newer version on open and whenever the app comes back to the screen
async function checkUpdate(){
  try{ const r=await fetch(location.pathname.replace(/\/$/,'/index.html')+'?check='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/APP_VERSION="([^"]+)"/); if(!m||m[1]===APP_VERSION) return;
    let tried=null; try{ tried=sessionStorage.getItem('rc-upd'); }catch(e){}
    if(tried===m[1]) return; try{ sessionStorage.setItem('rc-upd',m[1]); }catch(e){}
    toast('Updating to the latest version…'); setTimeout(()=>{ const u=new URL(location.href); u.searchParams.set('v',m[1]); location.replace(u.toString()); },600);
  }catch(e){} }
setTimeout(checkUpdate,1500); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
/* ================= boot ================= */
(async()=>{
  try{ await loadData(); }catch(e){ $('loadmsg').textContent='Could not load the bus data ('+e.message+').'; return; }
  $('loading').style.display='none'; initTime(); resize();
  loadPlaces(); loadBasemap().then(loadWalk);
  startGPS(null);
  if(state.me && !state.from){ state.from={x:state.me.x,y:state.me.y,label:'My location'}; $('fromIn').value='My location'; }
  // initial view: whole network
  initialFit();
})();
addEventListener('resize',resize);
try{ new ResizeObserver(resize).observe(cv); }catch(e){}
try{ if(window.visualViewport) visualViewport.addEventListener('resize',resize); }catch(e){}
(function watchDPR(){ try{ const m=matchMedia(`(resolution: ${window.devicePixelRatio||1}dppx)`); m.addEventListener('change',()=>{ resize(); watchDPR(); },{once:true}); }catch(e){} })();
addEventListener('pageshow',resize); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) resize(); });
[100,400,1200].forEach(t=>setTimeout(resize,t));
</script>
